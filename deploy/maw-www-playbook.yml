# narrowly focused ansible deployment playbook for www.mikeandwan.us
---
- name: Configure Service Account
  hosts: webservers
  become: true

  tasks:
    - name: Add Service Account
      ansible.builtin.user:
        name: "{{ svcacct_name }}"
        password: "{{ svcacct_pwd | password_hash('sha512') }}"
        update_password: always
        state: present

    # fedora creates a unique subuid range automatically, so need to do this via usermod here

    - name: Enable Linger for Service Account
      ansible.builtin.command:
        cmd: loginctl enable-linger "{{ svcacct_name | quote }}"

    - name: Add SSH key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ svcacct_name }}"
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
        state: present

- name: Configure Application
  hosts: webservers
  become: true
  become_user: "{{ svcacct_name }}"
  vars_files:
    - vars/maw-www.yml

  tasks:
    - name: Create Directories
      ansible.builtin.file:
        path: "{{ item }}"
        recurse: true
        state: directory
      loop:
        - "{{ dir_systemd }}"
        - "{{ dir_pgbackups }}"
        - "{{ dir_pgdata }}"
        - "{{ dir_pgsecrets }}"
        - "{{ dir_wwwsecrets }}"
        - "{{ dir_wwwdp }}"
        - "{{ dir_rcloneconf }}"
        - "{{ dir_rclonesecrets }}"
        - "{{ dir_scripts }}"
        - "{{ dir_podman_secrets }}"
        - "{{ dir_kube }}"

    - name: Check Postgres Data Versions
      ansible.builtin.import_tasks: tasks/pg-data-versions.yml

    # without this, raising pg_major and deploying would start the new major on an empty
    # pg-data/<major> directory: the site would come up against a blank database while
    # the real data sat untouched in the older directory
    - name: Ensure Postgres Data Is Ready For This Version
      ansible.builtin.assert:
        that: pg_major | int in pg_data_versions or pg_data_older | length == 0
        fail_msg: >-
          pg-data holds postgres {{ pg_data_older | max }} data but there is no postgres {{ pg_major }}
          data yet.  run `./deploy.sh pg-upgrade` to carry it forward
        quiet: true

    - name: Copy Files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: u+rw
      loop:
        - src: "{{ dir_localroot }}/pg-secrets/psql-postgres"
          dest: "{{ dir_pgsecrets }}"
        - src: "{{ dir_localroot }}/www-secrets/google-email-creds.json"
          dest: "{{ dir_wwwsecrets }}"
        - src: "{{ dir_localroot }}/www-secrets/maw-www.pfx"
          dest: "{{ dir_wwwsecrets }}"
        - src: "{{ dir_localroot }}/www-secrets/npgsql-passfile-svc_maw_www"
          dest: "{{ dir_wwwsecrets }}"
        - src: "{{ dir_localroot }}/rclone-config/rclone.conf"
          dest: "{{ dir_rcloneconf }}"
        - src: "{{ dir_localroot }}/rclone-secrets/rclone-gdrive-serviceaccount.json"
          dest: "{{ dir_rclonesecrets }}"

    - name: Process Templates
      ansible.builtin.template:
        dest: "{{ item.dest }}"
        src: "{{ item.src }}"
        mode: u+rw
      loop:
        - { "src": "kube.yml.j2", "dest": "{{ file_kube }}" }

    - name: Establish Login to registry
      containers.podman.podman_login:
        registry: docker.io
        authfile: "{{ podman_authfile }}"
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"

    - name: Create maw-www Quadlet
      containers.podman.podman_play:
        kube_file: "{{ file_kube }}"
        state: quadlet
        recreate: true
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        quadlet_filename: "{{ pod }}"
        quadlet_file_mode: '0640'
        quadlet_options:
          - "AutoUpdate=registry"
          - |

            [Unit]
            Description=Pod for maw-www database and website

            [Install]
            WantedBy=multi-user.target default.target

            [Service]
            Restart=on-failure

    - name: Start and Enable Pod / Containers
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: "{{ pod }}"
        scope: user
        enabled: true
        state: restarted

    - name: Copy DB Maintenance systemd services/timers
      ansible.builtin.template:
        dest: "{{ dir_systemd }}/{{ item.dest }}"
        src: "{{ item.src }}"
      loop:
        - { "src": "pg-maintenance.service.j2", "dest": "pg-maintenance.service" }
        - { "src": "pg-maintenance.timer.j2",   "dest": "pg-maintenance.timer" }
        - { "src": "rclone-archive.service.j2", "dest": "rclone-archive.service" }
        - { "src": "rclone-archive.timer.j2",   "dest": "rclone-archive.timer" }

    - name: Enable Maintenance Systemd Timers
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
      loop:
        - "pg-maintenance.timer"
        - "rclone-archive.timer"

    - name: Prepare Admin Scripts
      ansible.builtin.template:
        dest: "{{ dir_scripts }}/{{ item.dest }}"
        src: "{{ item.src }}"
        mode: "u+rwx"
      loop:
        - { "src": "sql-www.sh.j2", "dest": "sql-www.sh" }
        - { "src": "logs.sh.j2", "dest": "logs.sh" }
