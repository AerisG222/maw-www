name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  IID_FILE: image.iid

# the image is pushed with docker hub credentials from secrets, not GITHUB_TOKEN,
# so this workflow only ever needs to read the repository.  declared explicitly
# because the default token is read-write - the same reason scorecard.yml sets it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: build container image
      run: |
        buildah bud \
          -f Containerfile \
          -t maw-www \
          --iidfile "$IID_FILE"

    - name: populate image id variable
      run: echo "IID=$(cat $IID_FILE)" >> "$GITHUB_ENV"

    - name: push image with specific tag
      env:
        DH_USER: ${{ secrets.DH_USER }}
        DH_PASS: ${{ secrets.DH_PASS }}
      run: |
        buildah push \
          --creds "$DH_USER:$DH_PASS" \
          "${IID}" \
          docker://aerisg222/maw-www:"$(date +%Y%m%d%H%M%S)"

    - name: push image with latest tag
      env:
        DH_USER: ${{ secrets.DH_USER }}
        DH_PASS: ${{ secrets.DH_PASS }}
      run: |
        buildah push \
          --creds "$DH_USER:$DH_PASS" \
          "${IID}" \
          docker://aerisg222/maw-www:latest
